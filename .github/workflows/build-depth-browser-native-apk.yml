name: Build Quest Depth Browser Native APK

on:
  workflow_dispatch:
  push:
    branches: [ depth-browser-native-v020 ]
    paths:
      - '.github/workflows/build-depth-browser-native-apk.yml'
      - 'QuestDepthBrowserNative/**'
      - 'scripts/install_android.sh'

permissions:
  contents: read

concurrency:
  group: quest-depth-browser-native-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.2.6'
  APP_ID: 'com.bvultrex.questdepthbrowser.native'
  APP_LABEL: 'Quest Depth Browser Native'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK, NDK and CMake
        run: bash scripts/install_android.sh

      - name: Checkout Meta OpenXR SDK v85
        uses: actions/checkout@v7
        with:
          repository: meta-quest/Meta-OpenXR-SDK
          ref: v85
          path: meta-openxr-sdk
          fetch-depth: 1

      - name: Apply native depth browser patches
        run: |
          python3 -m py_compile QuestDepthBrowserNative/patch_sample.py
          python3 QuestDepthBrowserNative/patch_sample.py
          cat QuestDepthBrowserNative/v021/parts/patch_v021.*.pyfrag > /tmp/patch_v021.py
          python3 -m py_compile /tmp/patch_v021.py
          python3 /tmp/patch_v021.py
          cat QuestDepthBrowserNative/v022/parts/patch_v022.*.pyfrag > /tmp/patch_v022.py
          python3 -m py_compile /tmp/patch_v022.py
          python3 /tmp/patch_v022.py
          python3 -m py_compile QuestDepthBrowserNative/v023/patch_v023.py
          python3 QuestDepthBrowserNative/v023/patch_v023.py
          python3 -m py_compile QuestDepthBrowserNative/v024/patch_v024.py
          python3 QuestDepthBrowserNative/v024/patch_v024.py
          python3 -m py_compile QuestDepthBrowserNative/v025/patch_v025.py
          python3 QuestDepthBrowserNative/v025/patch_v025.py
          python3 -m py_compile QuestDepthBrowserNative/v026/patch_v026.py
          python3 QuestDepthBrowserNative/v026/patch_v026.py

          ROOT=meta-openxr-sdk/Samples/XrSamples/XrPassthroughOcclusion
          SRC="$ROOT/Src/XrPassthroughOcclusion.cpp"
          NATIVE="$ROOT/Src/QuestDepthBrowserNative.cpp"
          INPUT="$ROOT/Src/XrPassthroughOcclusionInput.cpp"
          JAVA="$ROOT/java/com/oculus/xrpassthroughocclusion/QuestDepthBrowserBridge.java"
          ACTIVITY="$ROOT/java/com/oculus/xrpassthroughocclusion/MainNativeActivity.java"

          grep -n 'leftTriggerState' "$INPUT"
          grep -n 'leftGripState' "$INPUT"
          grep -n 'leftBrowserAimPose' "$SRC"
          grep -n 'useLeftHand' "$SRC"
          grep -n 'resizeCorner' "$NATIVE"
          grep -n 'centered 84% capture-safe viewport' "$NATIVE"
          grep -n 'safeScale = 0.84f' "$JAVA"
          grep -n 'showQuestKeyboard' "$JAVA"
          grep -n 'InputMethodManager.SHOW_IMPLICIT' "$JAVA"
          grep -n 'document.activeElement' "$JAVA"
          grep -n 'germanTextFor' "$JAVA"
          grep -n 'dispatchKeyEvent' "$ACTIVITY"
          grep -n 'samplerExternalOES' "$NATIVE"
          grep -n 'uEnvironmentDepthTexture' "$NATIVE"
          ! grep -q 'virtualDisplay.resize' "$JAVA"

      - name: Build debug APK
        working-directory: meta-openxr-sdk/Samples/XrSamples/XrPassthroughOcclusion/Projects/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          ROOT='meta-openxr-sdk/Samples/XrSamples/XrPassthroughOcclusion'
          APK=$(find "$ROOT/Projects/Android" -type f -path '*/build/outputs/apk/*' -name '*debug.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          OUT="dist/Quest-Depth-Browser-Native-v${APP_VERSION}-debug.apk"
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$OUT"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$OUT" | tee dist/APK-BADGING.txt
          grep -q "package: name='${APP_ID}'" dist/APK-BADGING.txt
          grep -Fq "application: label='${APP_LABEL}'" dist/APK-BADGING.txt
          cp QuestDepthBrowserNative/CONTROLS.txt dist/CONTROLS.txt
          cp "$ROOT/Src/QuestDepthBrowserNative.cpp" dist/QuestDepthBrowserNative.patched.cpp
          cp "$ROOT/Src/XrPassthroughOcclusion.cpp" dist/XrPassthroughOcclusion.patched.cpp
          cp "$ROOT/Src/XrPassthroughOcclusionInput.cpp" dist/XrPassthroughOcclusionInput.patched.cpp
          cp "$ROOT/java/com/oculus/xrpassthroughocclusion/QuestDepthBrowserBridge.java" dist/QuestDepthBrowserBridge.patched.java
          cp "$ROOT/java/com/oculus/xrpassthroughocclusion/MainNativeActivity.java" dist/MainNativeActivity.patched.java
          (cd dist && sha256sum "Quest-Depth-Browser-Native-v${APP_VERSION}-debug.apk" > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Quest-Depth-Browser-Native-v${{ env.APP_VERSION }}
          path: dist/
          if-no-files-found: error

name: Build Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-quest-apk.yml'
      - 'scripts/**'
      - 'PROJECT_STATE.md'
      - 'AUDIT.md'
      - 'HANDOFF.md'
      - 'README.md'
      - 'BUILD_STATE.md'

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.3.12'
  APP_ID: 'com.bvultrex.quest3mrmodelviewer'
  APP_LABEL: 'Quest3 MR Model Viewer'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK, NDK and CMake
        run: bash scripts/install_android.sh

      - name: Checkout Meta OpenXR SDK v85
        uses: actions/checkout@v7
        with:
          repository: meta-quest/Meta-OpenXR-SDK
          ref: v85
          path: meta-openxr-sdk
          fetch-depth: 1

      - name: Checkout cgltf v1.15
        uses: actions/checkout@v7
        with:
          repository: jkuhlmann/cgltf
          ref: v1.15
          path: cgltf-src
          fetch-depth: 1

      - name: Checkout stb image decoder
        uses: actions/checkout@v7
        with:
          repository: nothings/stb
          ref: 2c980bb59875b0d32144a71867fbdebb2f77cd20
          path: stb-src
          fetch-depth: 1

      - name: Brand Android app
        run: bash scripts/brand_android.sh

      - name: Apply viewer patches
        run: bash scripts/apply_patches.sh

      - name: Build debug APK
        working-directory: meta-openxr-sdk/Samples/XrSamples/XrPassthroughOcclusion/Projects/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect and verify APK
        run: bash scripts/verify_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Quest3-MR-ModelViewer-v${{ env.APP_VERSION }}
          path: dist/
          if-no-files-found: error

name: Build Quest Depth Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ depth-browser-prototype ]
    paths:
      - '.github/workflows/build-depth-browser-apk.yml'
      - 'QuestDepthBrowser/**'

permissions:
  contents: read

concurrency:
  group: quest-depth-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '0.1.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.0.12077973'

      - name: Checkout Meta Spatial SDK samples 0.14.0 baseline
        uses: actions/checkout@v7
        with:
          repository: meta-quest/Meta-Spatial-SDK-Samples
          ref: f233e2327b95f9871b75bdba867d6fdd726f07cc
          path: meta-spatial-samples
          fetch-depth: 1

      - name: Apply Quest Depth Browser patch
        shell: bash
        run: |
          set -euo pipefail
          cat QuestDepthBrowser/parts/patch_depth_browser.*.pyfrag > /tmp/patch_depth_browser.py
          python3 -m py_compile /tmp/patch_depth_browser.py
          python3 /tmp/patch_depth_browser.py
          grep -n 'com.bvultrex.questdepthbrowser' meta-spatial-samples/MediaPlayerSample/app/build.gradle.kts
          grep -n 'versionName = "0.1.1"' meta-spatial-samples/MediaPlayerSample/app/build.gradle.kts
          grep -n 'QuestDepthBrowserActivity' meta-spatial-samples/MediaPlayerSample/app/src/main/AndroidManifest.xml
          grep -n 'EnvironmentDepthMode.OCCLUSION' meta-spatial-samples/MediaPlayerSample/app/src/main/java/com/meta/spatial/samples/mediaplayersample/QuestDepthBrowserActivity.kt
          grep -n 'PanelRenderMode.Layer' meta-spatial-samples/MediaPlayerSample/app/src/main/java/com/meta/spatial/samples/mediaplayersample/QuestDepthBrowserActivity.kt

      - name: Build debug APK
        working-directory: meta-spatial-samples/MediaPlayerSample
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find meta-spatial-samples/MediaPlayerSample/app/build/outputs/apk -name '*debug.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" "dist/Quest-Depth-Browser-v${APP_VERSION}-debug.apk"
          sha256sum "dist/Quest-Depth-Browser-v${APP_VERSION}-debug.apk" > dist/SHA256SUMS.txt
          cp meta-spatial-samples/MediaPlayerSample/app/src/main/java/com/meta/spatial/samples/mediaplayersample/QuestDepthBrowserActivity.kt dist/QuestDepthBrowserActivity.patched.kt
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Quest-Depth-Browser-v${{ env.APP_VERSION }}
          path: dist/
          if-no-files-found: error
